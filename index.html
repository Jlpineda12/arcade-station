<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Arcade Station 1984 | JLP Retro Multi-Game Hub</title>
  <meta name="description" content="Arcade Station: gabinete retro con 5 juegos (Snake, Combat, Space, Breaker, Maze), música chiptune procedural con Web Audio API y estética synthwave/CRT. Por Jose Luis Pineda.">
  <meta name="theme-color" content="#07020f">
  <meta property="og:title" content="Arcade Station 1984 — 5 juegos retro en un gabinete">
  <meta property="og:description" content="Vanilla JS + Web Audio API. Cero dependencias, cero archivos de audio.">
  <meta property="og:image" content="https://jlpineda12.github.io/arcade-station/docs/screenshots/hub.png">
  <link rel="stylesheet" href="src/shell/shell.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕹️</text></svg>">
</head>
<body>
  <div class="arcade-viewport">

    <header data-marquee></header>

    <nav class="station-top-bar" aria-label="Cartuchos">
      <div class="cartridge-pills">
        <button class="cartridge-tab-btn" data-idx="0" style="--c:#00f5d4">🐍 SNAKE</button>
        <button class="cartridge-tab-btn" data-idx="1" style="--c:#ff334b">🥊 COMBAT</button>
        <button class="cartridge-tab-btn" data-idx="2" style="--c:#fda415">🚀 SPACE</button>
        <button class="cartridge-tab-btn" data-idx="3" style="--c:#ff758f">🧱 BREAKER</button>
        <button class="cartridge-tab-btn" data-idx="4" style="--c:#fee440">🍒 MAZE</button>
      </div>
      <button id="btn-return-hub" class="hub-pill-btn" style="display:none;" title="Volver al menú de juegos (Shift + Esc)">
        ◀ SALIR AL ARCADE HUB
      </button>
    </nav>

    <main class="arcade-cabinet">
      <div class="screen-wrapper">
        <canvas id="game-canvas" width="560" height="420" aria-label="Pantalla del juego"></canvas>
      </div>
      <section class="arcade-control-deck"></section>
    </main>

    <footer data-status></footer>
    <p class="arcade-footer">Hecho a mano por <a href="https://github.com/Jlpineda12" target="_blank" rel="noopener">Jose Luis Pineda</a> · Ingeniería en Multimedia · Colombia</p>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
